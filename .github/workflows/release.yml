name: Release npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to release
        required: true
        type: string
      commit:
        description: Full 40-character SHA at the head of main
        required: true
        type: string
      smoke_record_url:
        description: Issue comment URL containing the signed-off manual smoke record
        required: true
        type: string
      dry_run:
        description: Verify every gate and print the mutation plan without publishing
        required: true
        default: true
        type: boolean

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      create_release: ${{ steps.preflight.outputs.create_release }}
      create_tag: ${{ steps.preflight.outputs.create_tag }}
      publish: ${{ steps.preflight.outputs.publish }}
      tag: ${{ steps.preflight.outputs.tag }}
    steps:
      - name: Require dispatch from main
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: test "$DISPATCH_REF" = refs/heads/main

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm package:smoke

      - name: Verify Release Gate and compute recovery plan
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          SMOKE_RECORD_URL: ${{ inputs.smoke_record_url }}
        run: pnpm exec tsx scripts/release-preflight.ts

      - name: Preserve the verified package for trusted publishing
        if: ${{ !inputs.dry_run && steps.preflight.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-package
          path: ${{ steps.preflight.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

      - name: Report dry-run plan
        if: ${{ inputs.dry_run }}
        env:
          CREATE_RELEASE: ${{ steps.preflight.outputs.create_release }}
          CREATE_TAG: ${{ steps.preflight.outputs.create_tag }}
          PUBLISH: ${{ steps.preflight.outputs.publish }}
        run: |
          echo "dry-run: publish=$PUBLISH create_tag=$CREATE_TAG create_release=$CREATE_RELEASE"

  publish:
    name: Publish with npm trusted publishing
    needs: validate
    if: ${{ !inputs.dry_run && needs.validate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: npm-release-package
          path: npm-release-package

      - run: npm publish npm-release-package/*.tgz --access public --provenance

  metadata:
    name: Create release metadata
    needs:
      - validate
      - publish
    if: ${{ always() && !inputs.dry_run && needs.validate.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create immutable version tag
        if: ${{ needs.validate.outputs.create_tag == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: gh api --method POST "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT"

      - name: Create GitHub Release
        if: ${{ needs.validate.outputs.create_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" --generate-notes
